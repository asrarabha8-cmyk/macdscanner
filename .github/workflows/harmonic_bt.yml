name: Harmonic Backtest (Carney)

# باك تست نماذج كارني على بيانات حقيقية.
# يُشغَّل يدوياً من Actions — الهدف منه الإجابة على سؤال واحد:
# هل تملك النماذج ميزة فوق الدخول العشوائي بنفس الهندسة؟
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "رموز مفصولة بفاصلة (فارغ = watchlist.txt)"
        type: string
        default: ""
      period:
        description: "المدة التاريخية"
        type: choice
        options: ["2y", "5y", "10y", "max"]
        default: "10y"
      tf:
        description: "الفاصل الزمني"
        type: choice
        options: ["1d", "1wk", "1h"]
        default: "1d"
      pivot:
        description: "قوة المحور — أكبر متغير وحده، والكتاب صامت عنه"
        type: choice
        options: ["3", "4", "5", "7", "10"]
        default: "5"
      signal_only:
        description: "مرحلة SIGNAL فقط (أكثر التزاماً بالكتاب)"
        type: boolean
        default: false
      max_hold:
        description: "أقصى شمعات للصفقة"
        type: string
        default: "60"

permissions:
  contents: read

concurrency:
  group: harmonic-bt
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install --quiet -r harmonic/requirements.txt

      - name: تحقق من الميكانيكا قبل أي رقم
        working-directory: harmonic
        run: |
          echo "::group::اختبارات الكاشف"
          python test_harmonic.py
          echo "::endgroup::"
          echo "::group::اختبارات الباك تست — أهمها اختبار التسريب المستقبلي"
          python test_backtest.py
          echo "::endgroup::"

      - name: الباك تست على بيانات حقيقية
        working-directory: harmonic
        run: |
          if [ -n "${{ inputs.symbols }}" ]; then
            ARGS="--symbols ${{ inputs.symbols }}"
          else
            ARGS="--tickers ../watchlist.txt"
          fi
          if [ "${{ inputs.signal_only }}" = "true" ]; then
            ARGS="$ARGS --signal-only"
          fi
          python backtest.py $ARGS \
            --period "${{ inputs.period }}" \
            --tf "${{ inputs.tf }}" \
            --pivot "${{ inputs.pivot }}" \
            --max-hold "${{ inputs.max_hold }}" \
            --json bt_results.json \
            | tee bt_report.txt

      - name: مقارنة قوى المحاور
        working-directory: harmonic
        continue-on-error: true
        run: |
          # الكتاب لا يذكر طريقة تحديد المحاور، فنقيس أثرها بأنفسنا
          echo "مقارنة أثر قوة المحور على النتيجة" | tee pivot_sweep.txt
          for P in 3 4 5 7 10; do
            echo "── محور $P ──" | tee -a pivot_sweep.txt
            if [ -n "${{ inputs.symbols }}" ]; then S="--symbols ${{ inputs.symbols }}"; else S="--tickers ../watchlist.txt"; fi
            python backtest.py $S --period "${{ inputs.period }}" --tf "${{ inputs.tf }}" \
              --pivot "$P" --max-hold "${{ inputs.max_hold }}" --no-baseline \
              2>/dev/null | grep -E "الإجمالي|لا صفقات" | tee -a pivot_sweep.txt || true
          done

      - name: رفع النتائج
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmonic-backtest-${{ inputs.period }}-pivot${{ inputs.pivot }}
          path: |
            harmonic/bt_report.txt
            harmonic/bt_results.json
            harmonic/pivot_sweep.txt
          retention-days: 30

      - name: الملخص في صفحة التشغيل
        if: always()
        working-directory: harmonic
        run: |
          {
            echo "## باك تست نماذج كارني"
            echo ""
            echo "\`${{ inputs.period }}\` · \`${{ inputs.tf }}\` · محور \`${{ inputs.pivot }}\` · أقصى حمل \`${{ inputs.max_hold }}\`"
            echo ""
            echo '```'
            cat bt_report.txt 2>/dev/null || echo "لم يكتمل"
            echo '```'
            if [ -f pivot_sweep.txt ]; then
              echo ""
              echo "### أثر قوة المحور"
              echo '```'
              cat pivot_sweep.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
