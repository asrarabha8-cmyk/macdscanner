name: SMC Breakout Scanner

on:
  schedule:
    # إغلاقات شموع 4 ساعات للسوق الأمريكي (UTC)
    - cron: "35 17 * * 1-5"
    - cron: "05 21 * * 1-5"
  workflow_dispatch:        # تشغيل يدوي من زر في GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install yfinance pandas requests lxml

      - name: تشغيل الماسح
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python smc_breakout_scanner.py

      - name: حفظ سجل التنبيهات
        uses: actions/upload-artifact@v4
        with:
          name: alerts-log
          path: alerts_log.csv
          if-no-files-found: ignore
