name: Strategy Lab (vectorbt)

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "الاستراتيجية"
        type: choice
        options: [all, ankush, ma100, ema_cross]
        default: all
      sweep:
        description: "تجربة كل الإعدادات"
        type: boolean
        default: true
      years:
        description: "عدد السنوات"
        default: "10"
  push:
    branches: [lab]
    paths: ["backtest/lab/*.py", "backtest/lab/*.txt", ".github/workflows/lab.yml"]

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install vectorbt yfinance pandas numpy tabulate
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: backtest/lab/cache
          key: lab-data-${{ hashFiles('backtest/lab/universe_*.txt') }}-${{ steps.day.outputs.d }}
      - name: Run lab
        working-directory: backtest/lab
        run: |
          set -o pipefail
          SWEEP=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.sweep }}" = "true" ]; then SWEEP="--sweep"; fi
          python run.py --strategy "${{ inputs.strategy || 'all' }}" --years "${{ inputs.years || '10' }}" $SWEEP 2>&1 | tee results/run_log.txt || true
          test -s results/run_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "lab-bot"
          git config user.email "lab-bot@users.noreply.github.com"
          git add backtest/lab/results || true
          git diff --cached --quiet || git commit -m "lab results $(date -u +%F) [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
