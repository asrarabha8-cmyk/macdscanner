name: Video ORB Backtest (15m range + 5m close + retest)

on:
  workflow_dispatch:
    inputs:
      tickers:
        default: "SPY QQQ NVDA TSLA AAPL AMD META"
      years:
        default: "2"
      target_r:
        default: "2"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: momentum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pandas numpy
      - name: Backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TARGET_R: ${{ inputs.target_r }}
        run: python video_orb_backtest.py --tickers ${{ inputs.tickers }} --years ${{ inputs.years }} --out results
      - name: Commit results
        if: always()
        run: |
          git config user.name  "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add results/video_orb_* || true
          git diff --cached --quiet || git commit -m "video orb results $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
