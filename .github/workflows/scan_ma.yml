name: MA 100/200 Breakout Scan

on:
  repository_dispatch:
    types: [ma]
  # GitHub's own schedule kept dropping runs; a Claude scheduled task now
  # sends a repository_dispatch (type: ma) at the right time instead.
  # schedule:
  #  # مرة واحدة يومياً بعد إغلاق السوق الأمريكي (22:15 بالتوقيت العالمي UTC)
  #  - cron: "15 22 * * 1-5"
  workflow_dispatch:        # زر تشغيل يدوي للتجربة

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install --quiet yfinance pandas numpy requests

      - name: الفحص
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python ma100_200_scanner.py
