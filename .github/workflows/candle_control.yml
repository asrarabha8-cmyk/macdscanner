name: Candle Control BT

on:
  workflow_dispatch:
  push:
    paths:
      - research/candle_control_bt.py
      - .github/workflows/candle_control.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Run
        run: python research/candle_control_bt.py --tf 1wk --market sa
      - name: Save results
        if: always()
        run: |
          git config user.name "edge-lab-bot"
          git config user.email "edge-lab-bot@users.noreply.github.com"
          git add research/candle_control_results* || true
          git diff --cached --quiet || git commit -m "candle control results $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
