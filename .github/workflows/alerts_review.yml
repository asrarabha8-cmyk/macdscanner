name: Alerts Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [review/trigger.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: alerts-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests yfinance pandas
      - name: Dump run logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python review/dump_runs.py
      - name: Evaluate
        if: hashFiles('review/evaluate.py') != ''
        run: python review/evaluate.py
      - name: Save
        if: always()
        run: |
          git config user.name "alerts-review-bot"
          git config user.email "alerts-review-bot@users.noreply.github.com"
          git add review || true
          git diff --cached --quiet || git commit -q -m "alerts review $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
