name: Edge Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Run
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python research/edge_lab.py
      - name: Save results
        if: always()
        run: |
          git config user.name "edge-lab-bot"
          git config user.email "edge-lab-bot@users.noreply.github.com"
          git add research/results.md research/results.json || true
          git diff --cached --quiet || git commit -m "edge lab results $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
