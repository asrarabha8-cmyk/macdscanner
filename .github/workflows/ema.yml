name: EMA Cross Scan

on:
  repository_dispatch:
    types: [ema]
  # GitHub's own schedule replaces the Claude scheduled task (saves Claude usage).
  schedule:
    # السبت 02:07 UTC — بعد إغلاق الجمعة، فالشمعة الأسبوعية مكتملة
    - cron: "7 2 * * 6"
  workflow_dispatch:        # زر تشغيل يدوي للتجربة

jobs:
  ema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install --quiet yfinance pandas numpy requests

      - name: فحص التقاطع
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PORTFOLIO: ${{ secrets.PORTFOLIO }}
        run: python ema_cross_scanner.py
