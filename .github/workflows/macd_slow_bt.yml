name: MACD Slow Backtest

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [macdslowbt]

permissions:
  contents: write

concurrency:
  group: macd-slow-bt
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install yfinance pandas numpy requests
      - name: Backtest
        run: |
          set -o pipefail
          python backtest/macd_slow_bt.py --out backtest/results_macd_slow 2>&1 | tee backtest/results_macd_slow_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "compare-bot"
          git config user.email "compare-bot@users.noreply.github.com"
          git add backtest || true
          git diff --cached --quiet || git commit -m "macd slow backtest $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
