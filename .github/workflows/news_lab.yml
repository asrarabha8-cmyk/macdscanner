name: News Lab

# يختبر: هل الأخبار وقت التنبيه تتنبأ بنتيجته؟ (تشغيل يدوي)
on:
  workflow_dispatch:
  push:
    branches: [news-lab]
    paths: [research/news_lab.py, news_guard.py]

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas
      - name: مختبر الأخبار
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python research/news_lab.py
      - name: حفظ النتائج
        if: always()
        run: |
          git config user.name "news-lab-bot"
          git config user.email "news-lab-bot@users.noreply.github.com"
          git add research/news_lab.md review/out/news_vs_outcome.csv || true
          git diff --cached --quiet || git commit -q -m "news lab $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
