name: Stocks In Play Forward Test

on:
  # كل يوم تداول بعد الإغلاق (22:20 UTC = 1:20 ص الرياض) + محاولة احتياطية
  schedule:
    - cron: "20 22 * * 1-5"
    - cron: "20 1 * * 2-6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [momentum/sip_forward.py]

permissions:
  contents: write

concurrency:
  group: sip-forward
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: momentum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy
      - name: Forward test (catches up missed days)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
        run: python sip_forward.py
      - name: Commit log
        if: always()
        run: |
          git config user.name  "sip-forward-bot"
          git config user.email "sip-forward-bot@users.noreply.github.com"
          git add forward || true
          git diff --cached --quiet || git commit -m "sip forward $(date -u +%F)"
          git pull --rebase --autostash || true
          git push || true
      - name: Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
        run: |
          curl -s --data-urlencode chat_id="$TG_CHAT" --data-urlencode text="⚠️ Stocks in Play forward test فشل اليوم — راجع Actions" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" > /dev/null
