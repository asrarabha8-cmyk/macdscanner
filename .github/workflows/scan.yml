name: MACD Cascade Scan

on:
  repository_dispatch:
    types: [scan]
  schedule:
    - cron: "2,32 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install --quiet yfinance pandas numpy requests

      - name: الفحص
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PORTFOLIO: ${{ secrets.PORTFOLIO }}
        run: python macd_cascade_scanner.py
