name: Dip Lab Saudi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - name: Run
        run: python research/dip_sa.py
      - name: Save results
        if: always()
        run: |
          git config user.name "edge-lab-bot"
          git config user.email "edge-lab-bot@users.noreply.github.com"
          git add research/dip_sa_results.md research/dip_sa_results.json || true
          git diff --cached --quiet || git commit -m "dip sa results $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
