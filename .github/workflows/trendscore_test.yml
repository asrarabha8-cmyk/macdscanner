name: TrendScore Validation

on:
  push:
    branches: [trendscore-test]
    paths: ["trendscore/*.py", "trendscore/*.csv", ".github/workflows/trendscore_test.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - name: Validate
        working-directory: trendscore
        run: |
          set -o pipefail
          python trendscore_validate.py 2>&1 | tee result.txt
      - name: Commit result
        if: always()
        run: |
          git config user.name "trendscore-bot"
          git config user.email "trendscore-bot@users.noreply.github.com"
          git add trendscore/result.txt || true
          git diff --cached --quiet || git commit -m "trendscore result [skip ci]"
          git push || true
