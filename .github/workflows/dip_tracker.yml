name: Dip Tracker

on:
  schedule:
    # Runs after the close. Two times to cover daylight saving.
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dip-tracker-data
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - name: Run
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python dip_tracker/dip_tracker.py
      - name: Save data
        if: always()
        run: |
          git config user.name "dip-tracker-bot"
          git config user.email "dip-tracker-bot@users.noreply.github.com"
          git add docs/dip/data || true
          git diff --cached --quiet || git commit -m "dip tracker log $(date -u +%F)"
          git pull --rebase -q || true
          git push || true
