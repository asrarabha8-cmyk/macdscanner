name: EMA Cross Print

on:
  push:
    branches: [ema-print]

jobs:
  ema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet yfinance pandas numpy requests
      - name: Scan without Telegram
        env:
          PORTFOLIO: ${{ secrets.PORTFOLIO }}
        run: python ema_cross_lastweek.py
