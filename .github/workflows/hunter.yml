name: Mispriced Hunter (monthly)

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [hunter]          # تشغيل من مهمة Claude المجدولة أول كل شهر
  schedule:
    - cron: "0 4 1 * *"      # احتياطي: أول كل شهر (cron في GitHub غير مضمون)

permissions:
  contents: write            # لحفظ reports/

concurrency:
  group: mispriced-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet yfinance pandas numpy requests lxml
      - name: Hunt
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python mispriced_hunter.py
      - name: Save reports
        if: always()
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@users.noreply.github.com"
          git add reports || true
          git diff --cached --quiet || git commit -m "mispriced hunter $(date -u +%Y-%m)"
          git pull --rebase -q || true
          git push || true
